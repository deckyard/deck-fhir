# Grimoire book configuration for the @deckyard/fhir documentation.

[book]
title = "@deckyard/fhir"
description = "HL7 FHIR R4 / R5 REST client"
language = "en"
src = "docs"

[build]
out = "site"
clean = true
jobs = 0

[html]
theme = "nordic"
mode = "auto"
navPosition = "left"
tocPosition = "right"
tocDepth = 3
sectionNumbers = true
titleUrl = "https://deckyard.github.io/deck-fhir/"
repoUrl = "https://github.com/deckyard/deck-fhir"
repoLabel = "Source"
editUrl = "https://github.com/deckyard/deck-fhir/edit/main/docs/{path}"

[highlight]
enabled = true

[search]
enabled = true

[pdf]
enabled = false
